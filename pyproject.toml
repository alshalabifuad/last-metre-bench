[project]
name = "lastmetre"
version = "0.1.0"
description = "Safe autonomy for the last metre of improvised-landmine clearance: Stage-A benchmark (pure Python)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lastmetre"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: closed-loop simulation tests (a minute or so)"]
